name: Sarak
options:
  bundleIdPrefix: com.chanhoyoo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "10"
    DEVELOPMENT_TEAM: 7VAL2U8BVL
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  Sarak:
    type: application
    platform: iOS
    sources:
      - Sarak
    resources: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chanhoyoo.sarak
        PRODUCT_NAME: Sarak
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sarak/App/Sarak.entitlements
        INFOPLIST_FILE: Sarak/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
