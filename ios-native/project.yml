name: Sarak
options:
  bundleIdPrefix: com.chanhoyoo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "12"
    DEVELOPMENT_TEAM: 7VAL2U8BVL
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  Sarak:
    type: application
    platform: iOS
    sources:
      - Sarak
    resources: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chanhoyoo.sarak
        PRODUCT_NAME: Sarak
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sarak/App/Sarak.entitlements
        INFOPLIST_FILE: Sarak/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: SarakWatch
  SarakWatch:
    type: application
    platform: watchOS
    sources:
      - SarakWatch
      - path: Sarak/Core/SarakDesign.swift
      - path: Sarak/Core/WordPath.swift
      - path: Sarak/Resources/mark-25.json
        buildPhase: resources
      - path: Sarak/Resources/Fonts/GowunBatang-Regular.ttf
        buildPhase: resources
    info:
      path: SarakWatch/Info.plist
      properties:
        CFBundleDisplayName: 사락
        CFBundleDevelopmentRegion: ko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.chanhoyoo.sarak
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [GowunBatang-Regular.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chanhoyoo.sarak.watchkitapp
        PRODUCT_NAME: SarakWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: true
